name: SociaLens video processing

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: socialens-video-processing
  cancel-in-progress: false

jobs:
  process-video-queue:
    name: Convert queued videos
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RUN_ONCE: "true"
      MAX_JOBS_PER_RUN: "2"
      BATCH_SIZE: "1"
      POLL_INTERVAL_MS: "1000"

    steps:
      - name: Check out SociaLens
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ensure FFmpeg is available
        timeout-minutes: 20
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "FFmpeg is missing; installing with extended network timeouts and retries."
            sudo timeout 6m apt-get update -qq \
              -o Acquire::http::Timeout=45 \
              -o Acquire::https::Timeout=45 \
              -o Acquire::Retries=2
            sudo timeout 12m apt-get install --yes --no-install-recommends \
              -o Acquire::http::Timeout=60 \
              -o Acquire::https::Timeout=60 \
              -o Acquire::Retries=3 ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install worker dependencies
        working-directory: video-worker
        run: npm install --omit=dev

      - name: Validate worker JavaScript
        working-directory: video-worker
        run: node --check worker.mjs

      - name: Verify required secrets are configured
        if: ${{ env.SUPABASE_URL == '' || env.SUPABASE_SERVICE_ROLE_KEY == '' }}
        run: |
          echo "::error::Add SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY under Settings > Secrets and variables > Actions."
          exit 1

      - name: Process queued videos
        working-directory: video-worker
        run: npm start
